<!DOCTYPE html>
<html><head></head><body><script>
// AppAgent Extension - Widget Sandbox
// Listed in manifest "sandbox" section => relaxed CSP (allows inline scripts + eval)
// Receives widget HTML via postMessage, renders via document.write
// After document.write, the widget's own scripts (including executeTool bridge) run normally

// Named handler so the loadWidget branch can RE-ATTACH it after document.open():
// per the HTML spec "document open steps" (steps 9-10, Chrome 72+), document.open()
// erases ALL event listeners on the document AND on its Window — including this
// very listener. The in-flight load still completes (the handler is already
// mid-execution), but without the re-attach below this window went permanently
// deaf the moment a widget rendered: live dark/light flips broadcast by
// broadcastWidgetTheme (ui/240-layout.js) never reached rendered widgets, so
// they kept the load-time theme until a full page reload.
var _widgetEvalInstanceId = null;
var _widgetEvalPort = null;

function closeWidgetEvalDocument() {
    if (!_widgetEvalPort) return;
    _widgetEvalPort.postMessage({ type: 'widgetDocumentGone' });
    _widgetEvalPort.close();
    _widgetEvalPort = null;
}

function connectWidgetEvalDocument() {
    if (!_widgetEvalInstanceId || _widgetEvalPort) return;
    var channel = new MessageChannel();
    var port = _widgetEvalPort = channel.port1;
    port.onmessage = function(event) {
        var data = event.data;
        if (!data || port !== _widgetEvalPort) return;
        if (data.type === 'widgetInstanceProbe') {
            port.postMessage({ type: 'widgetContentLoaded', probe_id: data.probe_id });
        } else if (data.type === 'widgetEval') {
            evaluateWidgetScript(data, port);
        }
    };
    port.start();
    window.addEventListener('pagehide', closeWidgetEvalDocument);
    // Outbound only. Parent never sends a port or eval code to the reusable
    // WindowProxy, including during readiness/probe handshakes.
    window.parent.postMessage({ type: 'widgetEvalChannel', instance_id: _widgetEvalInstanceId }, '*', [channel.port2]);
}

// Runs ONLY in this manifest-sandboxed frame (never the privileged panel).
// JSON boundary rejects unsupported values instead of silently dropping them.
async function evaluateWidgetScript(data, port) {
    if (!_widgetEvalInstanceId || data.instance_id !== _widgetEvalInstanceId || typeof data.request_id !== 'string' || typeof data.code !== 'string' || data.code.length > 65536) return;
    var json;
    try {
        var AsyncFunction = Object.getPrototypeOf(async function() {}).constructor;
        var value = await new AsyncFunction(data.code).call(window);
        json = JSON.stringify({ success: true, result: value === undefined ? null : value }, function(key, v) {
            var type = typeof v;
            if (type === 'function' || type === 'symbol' || type === 'bigint' || type === 'undefined' || (type === 'number' && !Number.isFinite(v))) throw new Error('Result is not JSON-compatible.');
            if (v && type === 'object' && !Array.isArray(v) && Object.getPrototypeOf(v) !== Object.prototype && Object.getPrototypeOf(v) !== null) throw new Error('Return plain JSON data, not DOM nodes or class instances.');
            return v;
        });
        if (json.length > 65536) throw new Error('Result exceeds 65536 characters.');
    } catch (error) {
        var message;
        try { message = String(error && error.message || error).slice(0, 1024); }
        catch (_) { message = 'Script rejected with an unserializable error.'; }
        json = JSON.stringify({ success: false, error: message });
    }
    if (port === _widgetEvalPort) port.postMessage({ type: 'widgetEvalResult', instance_id: data.instance_id, request_id: data.request_id, json: json });
}

function onParentMessage(e) {
    if (e.source !== window.parent) return;
    // Window messages are bootstrap/theme only; eval and probes require the
    // original document-owned MessagePort.
    if (e.data && e.data.type === 'loadWidget') {
        closeWidgetEvalDocument();
        _widgetEvalInstanceId = e.data.instance_id || null;
        window._widgetInstanceId = _widgetEvalInstanceId;
        document.open();
        document.write(e.data.html);
        document.close();
        // Re-attach immediately: document.open() above just erased every window
        // listener, this one included. Same function reference, so a repeat
        // loadWidget can never double-register (addEventListener dedupes).
        window.addEventListener('message', onParentMessage);
        // Design-token theme hook. The parent injects a token <style> whose dark
        // half is scoped to :root[data-appagent-theme="dark"] (injectWidgetTokens
        // in ui/070-dashboard-ui.js), so we mark the document with the theme the
        // parent resolved. MUST run after document.close(): document.write built a
        // brand new documentElement, so anything set before this point is gone.
        try { document.documentElement.setAttribute('data-appagent-theme', e.data.theme || 'light'); } catch (err) {}
        // Notify parent ONLY AFTER the newly written content has been laid out and
        // painted, so a screenshot taken on this signal reflects the FINAL rendered
        // widget (not a pre-layout / pre-font-swap frame). The deep-link capture
        // path (take_screenshot target:widget) depends on this being deterministic:
        // double rAF guarantees one full frame after layout; fonts.ready avoids
        // capturing before web fonts swap in. (window survives document.write, so
        // requestAnimationFrame / document.fonts remain valid here.)
        // rAF-OR-setTimeout fallback: this widget renders inside the HIDDEN screenshot
        // temp tab (chrome.tabs.create active:false), where rAF callbacks are throttled/
        // paused, so a bare requestAnimationFrame chain never fires and widgetContentLoaded
        // is never posted -> the capturer always hit the 8s timeout. _nextFrame fires on
        // whichever of rAF or a 50ms timer comes first, so the signal progresses even in a
        // hidden tab; rAF still wins in a visible/foreground tab (timing unchanged there).
        var _nextFrame = function(cb){ var done=false; var fire=function(){ if(done) return; done=true; try{ cb(); }catch(e){} }; try{ requestAnimationFrame(fire); }catch(e){} setTimeout(fire, 50); };
        var _signalRendered = function() {
            connectWidgetEvalDocument();
            try { window.parent.postMessage({ type: 'widgetContentLoaded', instance_id: _widgetEvalInstanceId }, '*'); } catch (err) {}
        };
        var _afterLayout = function() {
            _nextFrame(function() { _nextFrame(_signalRendered); });
        };
        if (document.fonts && document.fonts.ready && typeof document.fonts.ready.then === 'function') {
            // Guard against a never-resolving fonts.ready (also throttled in hidden tabs):
            // race it against a 200ms cap so the chain can't hang waiting on font swap.
            Promise.race([document.fonts.ready, new Promise(function(r){ setTimeout(r, 200); })]).then(_afterLayout, _afterLayout);
        } else {
            _afterLayout();
        }
    }
    // Live theme flips, broadcast by applyTheme/broadcastWidgetTheme
    // (ui/240-layout.js) to every widget iframe. Only the attribute changes: the
    // widget is NOT re-written, so its scripts, state and scroll position survive
    // and the token block's dark overrides simply start/stop matching. Works
    // standalone (documentElement always exists, even before any loadWidget) and
    // never touches the ready handshake. Post-render delivery depends on the
    // re-attach inside the loadWidget branch above.
    if (e.data && e.data.type === 'themeChange') {
        try { document.documentElement.setAttribute('data-appagent-theme', e.data.theme === 'dark' ? 'dark' : 'light'); } catch (err) {}
    }
}
window.addEventListener('message', onParentMessage);

// Signal ready to parent (AFTER the listener is attached, so the parent's
// loadWidget reply can never race past an unregistered handler)
window.parent.postMessage({ type: 'widgetSandboxReady' }, '*');
</script></body></html>
