// AppAgent Extension - Sandboxed Execution Environment
// Listed in manifest "sandbox" section => relaxed CSP (allows inline scripts + eval)
// No chrome.* API access - communicates only via postMessage

// offscreen document, where Chrome's intensive wake-up throttling aligns
// chained setTimeout timers to 1/minute (page hidden >= 5 min + timer
// nesting >= 5). postMessage is NOT throttled, so sleep(ms) round-trips to
// the service worker (parent's '__sandbox_sleep' intercept in
// offscreen-helper.js -> 'sw-sleep' handler in background.js) and resolves
// on time — no local timers on the bridged path. Fallback: a parent that
// does not implement the intercept (page-side sandbox hosts route it to
// executeTool, which errors or returns a plain result without __sleep_ok)

// Workspace file loading — bridge to the `run_js_file` tool (impl:
// src/js/tools/160-run-tests.js executeRunJsFile). loadFile returns the RAW
// file text (not the line-numbered `workspace read` view); runFile evaluates
// it HERE, in this sandbox, so exported functions stay callable (a nested
// sandbox could only hand back structured-cloneable data).
window.loadFile = function(path, workspace) {
    return window.executeTool('run_js_file', { path: path, mode: 'source', workspace: workspace }).then(function(r) {
        if (!r || !r.success) throw new Error('loadFile(' + path + '): ' + ((r && r.error) || 'unknown error'));

};
// Lexical mask: returns a same-length copy of `src` where the BODIES of string

// blanked to spaces (newlines kept), so the regex scans below
// (_topLevelDeclNames, evalModules' var pre-seed + typeof rewrite) never fire
// inside a string or comment. Indices map 1:1 onto the original, so a match in
// the mask is spliced into the original by index. Regex-vs-division is a
// heuristic (previous significant char/keyword); an unterminated literal or
// comment returns the raw source (old behaviour) rather than a wrong mask.

// Evaluate `src` as a CommonJS-style module in this sandbox. Resolution order:

    return window.loadFile(path, workspace).then(function(src) { return window.evalModule(src, path, args); });
};

// ─── Real-module loader ──────────────────────────────────────────────────────
// loadModules([paths], opts) evaluates several browser-global-style src/js/**
// files into ONE shared scope, in order (mirrors build concatenation), and
// returns the merged namespace of their column-0 declarations
// (function/async function/var/let/const/class). Free identifiers resolve
// through a `with (__scope)` Proxy: opts.globals (stubs, e.g. harness
// fakeChrome()/fakeWindow()) first, then the ECMAScript intrinsics + a few
// safe web APIs below (SANDBOX_PASSTHROUGH_GLOBALS), else it THROWS
// `runFile: global X not stubbed`. `typeof X` guards are lenient (return
// undefined, name recorded in namespace.__unstubbed); opts.lenient:true makes
// EVERY unstubbed read lenient. `globalThis`/`self` map to opts.globals.window.
// Notes: `var` names are pre-seeded so hoisted reads yield undefined; a
// file-level 'use strict' is inert inside the with block; top-level `return`
// is NOT supported here (use runFile/evalModule for CommonJS-style files).
// namespace.__scope is the raw scope object (implicit globals land there).
// Passthrough plain functions (atob, structuredClone, setTimeout, …) are bound
// to the real window — called through the `with` Proxy they would otherwise get
// this=Proxy and throw "Illegal invocation"; constructors (own `prototype`) are
// returned as-is so their statics (Object.keys, Promise.resolve) stay reachable.
// NOTE: `Function`/`eval` passthrough means the stub scope is a convenience for
// isolating modules under test, NOT a security boundary — `new Function('return this')()`
// reaches the real sandbox window.
window.SANDBOX_PASSTHROUGH_GLOBALS = ('Object Function Array Number parseFloat parseInt Infinity NaN undefined Boolean String Symbol Date Promise RegExp Error AggregateError EvalError RangeError ReferenceError SyntaxError TypeError URIError JSON Math Intl ArrayBuffer SharedArrayBuffer Uint8Array Int8Array Uint16Array Int16Array Uint32Array Int32Array Float32Array Float64Array Uint8ClampedArray BigUint64Array BigInt64Array DataView Map BigInt Set WeakMap WeakSet Proxy Reflect FinalizationRegistry WeakRef decodeURI decodeURIComponent encodeURI encodeURIComponent escape unescape eval isFinite isNaN console setTimeout clearTimeout setInterval clearInterval queueMicrotask structuredClone TextEncoder TextDecoder URL URLSearchParams atob btoa crypto performance AbortController Blob').split(' ');

    opts = opts || {};

    var target = Object.create(null);
    Object.keys(globals).forEach(function(k) { target[k] = globals[k]; });
    var unstubbed = [], lenientName = null;
    target.__leniently = function(name, fn) { lenientName = name; try { return fn(); } finally { lenientName = null; } };
    var joined = srcs.map(function(s, i) { return '\n// ---- ' + ((names && names[i]) || ('module' + i)) + ' ----\n' + String(s); }).join('\n;');

    while ((m = reTypeof.exec(masked))) {

        last = m.index + m[0].length;

// Page-bundle build order (build/build.js JS_TIERS: core → ui → tools → app,
// numeric prefix within a tier) via `workspace ls`; opts.tiers narrows it.
window.buildOrder = async function(opts) {
    opts = opts || {};
    var tiers = opts.tiers || ['core', 'ui', 'tools', 'app'], out = [];
    for (var i = 0; i < tiers.length; i++) {

// setTimeout shim — best-effort mitigation for existing code that calls
// setTimeout directly: delays >= 1000ms are transparently routed through the
// SW-backed sleep; sub-second ones stay native. Semantics preserved: returns
// a numeric id, clearTimeout cancels it, extra args are forwarded to the
// callback. Limitations: shimmed ids come from a separate high range
// (> 2^30) so they never collide with native ids; the callback fires on the
// macrotask that delivers the bridge response (ordering across mixed
// native/shimmed timers is not guaranteed); string-code and setInterval are
// not shimmed.

    if (typeof fn !== 'function' || (Number(ms) || 0) < 1000) {

    var id = ++_shimNextId;

    return _nativeClearTimeout(id);

window.addEventListener('message', function(e) {
    if (e.source !== window.parent) return;
    // Tool result from parent
    if (e.data && e.data.type === 'sandboxToolResult' && window._pendingCalls[e.data.id]) {
        var cb = window._pendingCalls[e.data.id];
        delete window._pendingCalls[e.data.id];
        if (e.data.error) cb.reject(new Error(e.data.error));
        else cb.resolve(e.data.result);
    }
    // Execute code from parent
    if (e.data && e.data.type === 'sandboxExec') {
        (async function() {
            try {
                // Inject globals from parent context
                if (e.data.globals) {
                    Object.keys(e.data.globals).forEach(function(k) { window[k] = e.data.globals[k]; });

                var AsyncFunction = Object.getPrototypeOf(async function(){}).constructor;
                var fn = new AsyncFunction(e.data.code);

// Signal ready to parent
window.parent.postMessage({ type: 'sandboxReady' }, '*');
