<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>File Download</title>
<style>
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; background: #1a1a2e; color: #e0e0e0; }
.card { background: #16213e; border-radius: 12px; padding: 32px 40px; text-align: center; box-shadow: 0 4px 24px rgba(0,0,0,0.3); max-width: 480px; }
.filename { color: #7dd3fc; font-family: monospace; font-size: 15px; word-break: break-all; }
.error { color: #f87171; }
.debug { color: #666; font-size: 11px; margin-top: 16px; text-align: left; font-family: monospace; white-space: pre-wrap; word-break: break-all; }
.spinner { display: inline-block; width: 24px; height: 24px; border: 3px solid #334; border-top-color: #7dd3fc; border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 12px; }
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="card" id="card">
    <div class="spinner"></div>
    <p>Resolving file…</p>
</div>
<script src="file-download.js"></script>
</body>
</html>
