name: Attach extension zip to release

# Fires when a version tag (v*) is pushed: builds the extension from the
# tagged commit, creates the release if it doesn't exist yet, and uploads
# dist/extension/ as a zip asset. Independent from the Pages deploy in
# docs.yml so one failing doesn't block the other.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to attach the zip to (e.g. v1.0.4)"
        required: true

permissions:
  contents: write  # required to upload release assets

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag and version
        id: tag
        run: |
          # inputs.tag wins for manual dispatch; otherwise github.ref_name is the tag.
          TAG="${{ inputs.tag || github.ref_name }}"
          if [ -z "$TAG" ]; then echo "No tag available" >&2; exit 1; fi
          VERSION="${TAG#v}"  # strip leading v if present
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building zip for tag $TAG (version $VERSION)"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # The release tag is the source of truth. Override the manifest.version
      # field in the ephemeral checkout so the bundled extension reports the
      # tagged version even if the committed manifest wasn't bumped before
      # tagging. Surgical regex replace — leaves all other formatting untouched.
      - name: Sync manifest.json version to release tag
        run: |
          node -e '
            const fs = require("fs");
            const p = "src/platform/extension/manifest.json";
            const want = process.argv[1];
            const src = fs.readFileSync(p, "utf-8");
            const re = /("version"\s*:\s*)"[^"]+"/;
            const next = src.replace(re, `$1"${want}"`);
            if (next === src) console.log(`manifest.version already ${want}, no change`);
            else { fs.writeFileSync(p, next); console.log(`Updated manifest.version → ${want}`); }
          ' "${{ steps.tag.outputs.version }}"

      - name: Build extension
        run: npm run build

      - name: Zip dist/extension/
        run: |
          cd dist
          zip -r "../appagent-${{ steps.tag.outputs.version }}.zip" extension
          cd ..
          ls -lh appagent-*.zip

      - name: Create release if missing, then upload zip
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          ZIP="appagent-${{ steps.tag.outputs.version }}.zip"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "Creating release $TAG"
            gh release create "$TAG" --title "$TAG" --generate-notes
          else
            echo "Release $TAG already exists; uploading asset only"
          fi
          gh release upload "$TAG" "$ZIP" --clobber
